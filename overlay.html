<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dymometr Overlay</title>
    <style>
        body { background: transparent; margin: 0; padding: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .main-container { position: relative; width: 215px; height: 600px; }
        /* Tło - używamy tlo.png z głównego folderu */
        .background-dim { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('tlo.png') no-repeat center; 
            background-size: 100% 100%; filter: grayscale(100%) brightness(0.2); z-index: 1; 
        }
        /* Warstwa aktywna */
        .active-layer { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; 
            background: url('tlo.png') no-repeat bottom; 
            background-size: 215px 600px; filter: grayscale(0%) brightness(1.2); 
            transition: height 0.2s linear; z-index: 2; 
        }
        /* Kreska na górze - kreska.png z głównego folderu */
        .glow-line { 
            position: absolute; top: -15px; left: 0; width: 100%; height: 30px; 
            background: url('kreska.png') no-repeat center; 
            background-size: contain; z-index: 3; 
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="background-dim"></div>
        <div id="fill" class="active-layer"><div class="glow-line"></div></div>
    </div>
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}`);

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.level !== undefined) {
                document.getElementById("fill").style.height = data.level + "%";
            }
        };
        socket.onopen = () => console.log("Połączono z serwerem!");
        socket.onclose = () => setTimeout(() => location.reload(), 3000);
    </script>
</body>
</html>
