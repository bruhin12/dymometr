<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            background: transparent; 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Montserrat', sans-serif;
        }

        .main-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Kontener na fajerwerki wyrzucane w GÓRĘ */
        #confetti-canvas {
            position: absolute;
            top: -150px; /* Umieszczony NAD dymometrem */
            width: 400px;
            height: 300px;
            z-index: 20;
            pointer-events: none;
        }

        /* Szklana obudowa - modern / glassy style */
        .glass-tube {
            width: 70px; 
            height: 550px;
            background: rgba(255, 255, 255, 0.03); 
            border: 2px solid rgba(255, 102, 0, 0.4); 
            border-radius: 35px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3), 
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        /* Subtelny odblask na szkle */
        .glass-tube::after {
            content: "";
            position: absolute; top: 0; left: 10px;
            width: 8px; height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 35px; filter: blur(2px);
        }

        /* Pionowy napis DYMOMETR pod wypełnieniem */
        .title {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(180deg);
            color: rgba(255, 255, 255, 0.15); 
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            z-index: 10;
            writing-mode: vertical-rl;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
        }

        /* Kolorowe wypełnienie paska - gradient */
        .fill-bar {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 0%;
            background: linear-gradient(to top, #ff0000 0%, #ff8800 50%, #ffff00 100%);
            transition: height 0.3s ease-out;
            border-radius: 0 0 33px 33px;
            box-shadow: 0 0 25px rgba(255, 68, 0, 0.8);
            z-index: 5;
        }

        /* --- ANIMACJE EFEKTU --- */
        .shake-it { animation: intense-shake 0.6s ease-in-out forwards; }
        .flash-it { animation: intense-flash 0.8s ease-out forwards; }

        @keyframes intense-shake {
            0% { transform: translate(0,0); }
            15% { transform: translate(-10px, 6px) rotate(-3deg); }
            30% { transform: translate(10px, -6px) rotate(3deg); }
            100% { transform: translate(0,0); }
        }

        @keyframes intense-flash {
            0% { filter: brightness(1); }
            20% { filter: brightness(5) drop-shadow(0 0 40px gold); }
            100% { filter: brightness(1); }
        }
    </style>
</head>
<body>

    <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>

    <div class="main-wrapper" id="flash-zone">
        
        <canvas id="confetti-canvas"></canvas>

        <div class="glass-tube" id="widget-box">
            <div class="title">DYMOMETR</div>
            <div id="fill" class="fill-bar"></div>
        </div>

    </div>

    <script>
        // Konfiguracja efektu wybuchu
        let confettiSettings = {
            target: 'confetti-canvas',
            respawn: false, // Fajerwerki nie pojawiają się same z siebie
            size: 2, // Rozmiar cząsteczek
            colors: [
                [255, 102, 0], // Pomarańczowy
                [255, 204, 0], // Złoty/Żółty
                [255, 68, 0]   // Czerwony
            ],
            // Wystrzeliwujemy cząsteczki W GÓRĘ
            props: ['circle', 'square', 'line'],
            clock: 40,
            angle: 90, // Kąt 90 = prosto w górę
            spread: 50, // Rozrzut na boki
            start_from_edge: true,
            rotate: true
        };
        let confetti = new ConfettiGenerator(confettiSettings);

        const connect = () => {
            const socket = new WebSocket("ws://localhost:3000");
            const fill = document.getElementById("fill");
            const widget = document.getElementById("widget-box");
            const zone = document.getElementById("flash-zone");
            
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                fill.style.height = data.level + "%";

                if (data.triggerEffect === true) {
                    // Odpalamy wstrząs i błysk
                    widget.classList.remove("shake-it");
                    zone.classList.remove("flash-it");
                    void widget.offsetWidth; 
                    widget.classList.add("shake-it");
                    zone.classList.add("flash-it");

                    // ODPALAMY WYBUCH FAJERWERKÓW (confetti)
                    // Resetujemy generator, żeby wyrzucił nową partię
                    confetti.clear();
                    confetti = new ConfettiGenerator(confettiSettings);
                    confetti.render();

                    // Zatrzymujemy generator po 2 sekundach, żeby nie obciążał OBS
                    setTimeout(() => confetti.clear(), 2000);
                }
            };
            socket.onclose = () => setTimeout(connect, 2000);
        };
        connect();
    </script>
</body>
</html>
